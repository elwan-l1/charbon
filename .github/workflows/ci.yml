name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          [[ "$(xcodebuild -version | awk 'NR == 1 { print $2 }')" == 27.* ]]

      - name: Install development tools
        run: brew bundle

      - name: Lint and test
        run: make ci
